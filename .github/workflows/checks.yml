name: Checks
on:
  push:
  pull_request:
jobs:
  game:
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm assets:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project=${{ matrix.project }}
      - run: pnpm balance --seeds=30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-reports-${{ matrix.project }}
          path: |
            reports/balance-latest.*
            test-results/
