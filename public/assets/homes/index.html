<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The eight gardens · Moonlit Battle Garden</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px clamp(16px, 5vw, 80px); background: #10171e; color: #eee8da; font: 16px/1.6 Georgia, serif; }
    header, main, footer { max-width: 1400px; margin: auto; }
    h1 { font-size: clamp(36px, 5vw, 64px); font-weight: normal; margin: 8px 0; }
    header p { color: #b6bdc0; max-width: 720px; }
    a { color: #d8dca7; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 28px; padding: 32px 0; }
    article { min-width: 0; }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; image-rendering: pixelated; background: #090d18; }
    h2 { margin: 14px 0 2px; font-size: 28px; font-weight: normal; }
    article p { margin: 4px 0 12px; color: #b6bdc0; }
    small { color: #dbd59c; }
    audio { display: block; width: 100%; height: 44px; margin-top: 14px; }
    .art-credit { display: block; margin-top: 8px; font-size: 12px; }
    footer { padding: 16px 0 32px; color: #b6bdc0; }
    @media (max-width: 650px) { body { padding-top: 20px; } main { grid-template-columns: 1fr; gap: 32px; } }
  </style>
</head>
<body>
  <header>
    <a href="../../">Back to the game</a>
    <h1>The eight gardens</h1>
    <p>Two familiar homes, six new possibilities. The new theme names are provisional; their characters and minibios come next. Play a track to explore its mood.</p>
  </header>
  <main aria-label="Home collection"></main>
  <footer>Downloaded artwork and music, with no newly generated assets. <a href="CREDITS.md">Creators, credits and licenses</a></footer>
  <script type="module" src="review.js"></script>
</body>
</html>
