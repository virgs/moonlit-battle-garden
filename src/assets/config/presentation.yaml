# Stable drop-in paths. Missing art/music uses the existing prototype fallbacks.
castDefaults:
  frameWidth: 128
  frameHeight: 128
  frameCount: 8
  columns: 8
  fps: 12
  holdMs: 250
  sound: null
characters:
  champignon:
    victory: { src: /assets/characters/champignon/victory.png, frameWidth: 128, frameHeight: 160, frameCount: 9, columns: 9, fps: 8, holdMs: 0, sound: null }
    standing: { src: /assets/characters/champignon/standing.png, frameWidth: 128, frameHeight: 160, frameCount: 5, columns: 5, fps: 4, holdMs: 0, sound: null }
    icon: /assets/characters/champignon/icon.png
    portrait: /assets/characters/champignon/portrait.png
    effects:
      1: { src: /assets/characters/champignon/effect-1.png }
      2: { src: /assets/characters/champignon/effect-2.png }
      3: { src: /assets/characters/champignon/effect-3.png }
      4: { src: /assets/characters/champignon/effect-4.png }
    home:
      name: Sporelight Keep
      background:
        src: /assets/homes/champignon/background.png
        fallback: /assets/background-castle.png
        opacity: 0.72
        fallbackOpacity: 0.22
        fallbackTint: 11065008
        focusX: 0.5
        focusY: 0.15
      music:
        src: /assets/homes/champignon/music.mp3
        fallback: /assets/backgroundMusic.mp3
        volume: 0.16
        loopStartMs: 0
        loopEndMs: null
    casts:
      1: &champignonCast { src: /assets/characters/champignon/cast.png, frameWidth: 128, frameHeight: 160, frameCount: 9, columns: 9, fps: 9, holdMs: 500 }
      2: *champignonCast
      3: *champignonCast
      4: *champignonCast
  andy:
    victory: { src: /assets/characters/andy/victory.png, frameWidth: 128, frameHeight: 160, frameCount: 9, columns: 9, fps: 8, holdMs: 0, sound: null }
    standing: { src: /assets/characters/andy/standing.png, frameWidth: 128, frameHeight: 160, frameCount: 8, columns: 8, fps: 6, holdMs: 0, sound: null }
    icon: /assets/characters/andy/icon.png
    portrait: /assets/characters/andy/portrait.png
    effects:
      1: { src: /assets/characters/andy/effect-1.png }
      2: { src: /assets/characters/andy/effect-2.png }
      3: { src: /assets/characters/andy/effect-3.png }
      4: { src: /assets/characters/andy/effect-4.png }
    home:
      name: Moonlit Hideout
      background:
        src: /assets/homes/andy/background.png
        fallback: /assets/background-castle.png
        opacity: 0.58
        fallbackOpacity: 0.22
        fallbackTint: 14003401
        focusX: 0.5
        focusY: 0.5
      music:
        src: /assets/homes/andy/music.mp3
        fallback: /assets/backgroundMusic.mp3
        volume: 0.16
        loopStartMs: 0
        loopEndMs: null
    casts:
      1: { src: /assets/characters/andy/cast.png }
      2: { src: /assets/characters/andy/cast.png }
      3: { src: /assets/characters/andy/cast.png }
      4: { src: /assets/characters/andy/cast.png }
